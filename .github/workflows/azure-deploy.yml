name: CI/CD Despliegue Azure con Nginx

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: 'ecomercado-app' # Reemplazar con el nombre de tu Azure App Service
  CONTAINER_REGISTRY: 'tudockerhub_o_acr' # Reemplazar con tu Azure Container Registry (ej: minegocio.azurecr.io)
  IMAGE_NAME: 'ecomercado-nginx'

jobs:
  build-and-test:
    name: Compilación y Pruebas
    runs-on: ubuntu-latest
    steps:
      - name: Descargar Código
        uses: actions/checkout@v4

      - name: Configurar Node.js para Pruebas
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Ejecutar Suite de Validación
        run: node test_suite.js

      - name: Construir Imagen Docker con Nginx
        run: |
          docker build -t ${{ env.IMAGE_NAME }}:${{ github.sha }} .
          docker tag ${{ env.IMAGE_NAME }}:${{ github.sha }} ${{ env.IMAGE_NAME }}:latest

